# Journal retention for the study VM. Install to
# /etc/systemd/journald.conf.d/10-eten-retention.conf and restart
# systemd-journald.
#
# The application redacts IPs and participant ids before they reach the journal
# (eten_shared/log_redaction.py), so these bounds are defence in depth: they cap
# how long anything a future code path might log can sit on disk, and keep the
# journal from growing without limit on a VM nobody prunes by hand.

[Journal]
Storage=persistent

# Operational history is useful for about a week; a study incident older than
# that is reconstructed from the database, not from access lines.
MaxRetentionSec=7day

# Retention is only enforced at rotation, so rotate daily. Without this an
# active journal file can hold entries far older than MaxRetentionSec.
MaxFileSec=1day

# Hard ceiling, independent of time. Small enough that the VM's disk cannot
# fill with logs, large enough for a week of a low-traffic study platform.
SystemMaxUse=200M
