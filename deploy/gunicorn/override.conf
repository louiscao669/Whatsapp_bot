# systemd drop-in: run the platform under gunicorn instead of Flask's
# development server.
#
# Install as /etc/systemd/system/eten-platform.service.d/override.conf, so the
# existing unit's User, WorkingDirectory and EnvironmentFile are kept and only
# the command changes. Check what you have first:
#
#   systemctl cat eten-platform
#
# The empty ExecStart= is required: without it systemd APPENDS this command to
# the existing one and tries to run both.

[Service]
ExecStart=
ExecStart=/opt/eten-whatsapp-bot/.venv/bin/gunicorn \
    --chdir /opt/eten-whatsapp-bot/platform \
    --config /opt/eten-whatsapp-bot/deploy/gunicorn/gunicorn.conf.py \
    wsgi:application

# gunicorn reloads workers on SIGHUP without dropping connections, so a config
# change no longer needs a full restart that interrupts a participant mid-question.
ExecReload=/bin/kill -s HUP $MAINPID
KillSignal=SIGTERM
