
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  .page { background: #F5F3EE; padding: 20px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; min-height: 600px; display: flex; flex-direction: column; gap: 14px; }

  /* Tabs */
  .tabs { display: grid; grid-template-columns: 1fr 1fr; background: #E8E4DC; border-radius: 14px; padding: 4px; }
  .tab { text-align: center; padding: 10px; border-radius: 10px; font-size: 15px; font-weight: 800; color: #888; cursor: pointer; transition: all 0.15s; }
  .tab.active { background: #fff; color: #1a1a1a; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }

  /* Search */
  .search-wrap { position: relative; }
  .search-wrap input { width: 100%; padding: 12px 16px 12px 42px; border-radius: 14px; border: 1.5px solid #E0E0D8; background: #fff; font-size: 14px; font-family: inherit; color: #1a1a1a; outline: none; }
  .search-wrap input:focus { border-color: #58CC02; }
  .search-wrap input::placeholder { color: #bbb; }
  .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-size: 16px; color: #bbb; }

  /* Action buttons */
  .actions { display: flex; gap: 10px; }
  .btn-join { background: #58CC02; color: #fff; border: none; border-radius: 12px; padding: 11px 22px; font-size: 14px; font-weight: 800; cursor: pointer; box-shadow: 0 3px 0 #46A302; flex: 1; }
  .btn-create { background: #fff; color: #1a1a1a; border: 2px solid #1a1a1a; border-radius: 12px; padding: 11px 22px; font-size: 14px; font-weight: 800; cursor: pointer; box-shadow: 0 3px 0 #1a1a1a; flex: 1; }

  /* Podium */
  .podium { display: flex; align-items: flex-end; justify-content: center; gap: 10px; padding: 0 10px 4px; }
  .podium-item { display: flex; flex-direction: column; align-items: center; gap: 6px; flex: 1; }
  .pod-avatar { border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 900; color: #fff; flex-shrink: 0; border: 3px solid #fff; }
  .pod-name { font-size: 12px; font-weight: 800; color: #1a1a1a; text-align: center; }
  .pod-score { font-size: 11px; color: #888; font-weight: 700; }
  .pod-block { width: 100%; border-radius: 12px 12px 0 0; display: flex; align-items: center; justify-content: center; }
  .pod-rank { font-size: 20px; }

  /* List */
  .list { display: flex; flex-direction: column; gap: 8px; }
  .row { background: #fff; border-radius: 14px; border: 1.5px solid #E8E8E0; padding: 12px 16px; display: flex; align-items: center; gap: 12px; transition: transform 0.1s; cursor: pointer; }
  .row:hover { transform: translateX(2px); }
  .row.me { border-color: #58CC02; background: #F4FDE8; box-shadow: 0 3px 0 #46A302; }
  .rank-num { font-size: 15px; font-weight: 900; color: #bbb; width: 24px; text-align: center; flex-shrink: 0; }
  .rank-num.top { color: #FFB800; }
  .avatar { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 800; color: #fff; flex-shrink: 0; }
  .row-body { flex: 1; }
  .row-name { font-size: 14px; font-weight: 800; color: #1a1a1a; }
  .row-sub { font-size: 12px; color: #aaa; }
  .row-score { font-size: 18px; font-weight: 900; color: #1a1a1a; }
  .row-delta { font-size: 11px; font-weight: 800; color: #58CC02; }
  .week-badge { font-size: 10px; font-weight: 800; background: #FFF4E0; color: #A07000; border: 1.5px solid #FFD060; border-radius: 20px; padding: 2px 8px; }
</style>
