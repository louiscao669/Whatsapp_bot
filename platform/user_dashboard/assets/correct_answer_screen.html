
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }

  .screen { min-height: 600px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px 24px; position: relative; overflow: hidden; background: #1a3a1a; }

  /* Animated bg burst */
  .burst { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 60%, rgba(88,204,2,0.25) 0%, transparent 70%); animation: burstpulse 1.5s ease-out forwards; }
  @keyframes burstpulse { 0%{opacity:0;transform:scale(0.5)} 40%{opacity:1} 100%{opacity:0.6;transform:scale(1)} }

  /* Confetti pieces */
  .confetti-wrap { position:absolute; inset:0; pointer-events:none; overflow:hidden; }
  .confetti-piece { position:absolute; width:10px; height:10px; border-radius:2px; opacity:0; animation: conffall linear forwards; }
  @keyframes conffall {
    0%   { opacity:1; transform: translateY(-20px) rotate(0deg); }
    100% { opacity:0; transform: translateY(620px) rotate(720deg); }
  }

  /* Check circle */
  .check-wrap { position:relative; margin-bottom:24px; z-index:1; }
  .check-ring { width:120px; height:120px; border-radius:50%; background: #58CC02; border: 6px solid #46A302; box-shadow: 0 8px 0 #2E8A00, 0 0 0 0 rgba(88,204,2,0.4); display:flex; align-items:center; justify-content:center; animation: popin 0.4s cubic-bezier(0.34,1.56,0.64,1) forwards, ringpulse 1.5s ease-out 0.4s infinite; }
  @keyframes popin { 0%{transform:scale(0);opacity:0} 100%{transform:scale(1);opacity:1} }
  @keyframes ringpulse { 0%{box-shadow:0 8px 0 #2E8A00,0 0 0 0 rgba(88,204,2,0.5)} 100%{box-shadow:0 8px 0 #2E8A00,0 0 0 30px rgba(88,204,2,0)} }
  .check-icon { font-size:56px; animation: popin 0.4s cubic-bezier(0.34,1.56,0.64,1) 0.1s both; }

  /* Stars around check */
  .star { position:absolute; font-size:20px; animation: starfly 0.5s cubic-bezier(0.34,1.56,0.64,1) forwards; opacity:0; }
  .star:nth-child(1) { top:-10px; left:-10px; animation-delay:0.3s; --tx:-20px; --ty:-20px; }
  .star:nth-child(2) { top:-16px; left:50%; animation-delay:0.35s; --tx:-5px; --ty:-28px; }
  .star:nth-child(3) { top:-10px; right:-10px; animation-delay:0.3s; --tx:20px; --ty:-20px; }
  .star:nth-child(4) { top:50%; right:-20px; animation-delay:0.4s; --tx:26px; --ty:-5px; }
  .star:nth-child(5) { top:50%; left:-20px; animation-delay:0.4s; --tx:-26px; --ty:-5px; }
  @keyframes starfly { 0%{opacity:0;transform:translate(0,0) scale(0.3)} 60%{opacity:1;transform:translate(var(--tx),var(--ty)) scale(1.2)} 100%{opacity:1;transform:translate(var(--tx),var(--ty)) scale(1)} }

  /* Text */
  .headline { font-size:36px; font-weight:900; color:#fff; text-align:center; margin-bottom:8px; z-index:1; animation: slidein 0.4s ease-out 0.2s both; text-shadow: 0 2px 12px rgba(88,204,2,0.4); }
  @keyframes slidein { 0%{transform:translateY(16px);opacity:0} 100%{transform:translateY(0);opacity:1} }
  .sub { font-size:16px; color:rgba(255,255,255,0.6); text-align:center; margin-bottom:32px; z-index:1; animation: slidein 0.4s ease-out 0.3s both; }

  /* XP pill */
  .xp-row { display:flex; gap:12px; z-index:1; margin-bottom:32px; animation: slidein 0.4s ease-out 0.4s both; }
  .xp-pill { background:rgba(255,255,255,0.1); border:2px solid rgba(255,255,255,0.2); border-radius:20px; padding:10px 20px; display:flex; align-items:center; gap:8px; }
  .xp-icon { font-size:22px; }
  .xp-val { font-size:18px; font-weight:900; color:#fff; }
  .xp-label { font-size:12px; color:rgba(255,255,255,0.5); font-weight:700; }

  /* Streak bonus */
  .streak-box { background: rgba(255,150,0,0.15); border: 2px solid rgba(255,150,0,0.4); border-radius:16px; padding:14px 24px; display:flex; align-items:center; gap:12px; z-index:1; margin-bottom:36px; animation: slidein 0.4s ease-out 0.5s both; }
  .streak-text { text-align:left; }
  .streak-title { font-size:14px; font-weight:800; color:#FFB800; }
  .streak-sub { font-size:12px; color:rgba(255,255,255,0.4); margin-top:2px; }

  /* Progress bar */
  .prog-wrap { width:100%; max-width:300px; z-index:1; margin-bottom:32px; animation: slidein 0.4s ease-out 0.55s both; }
  .prog-label { display:flex; justify-content:space-between; font-size:12px; font-weight:800; color:rgba(255,255,255,0.4); margin-bottom:8px; }
  .prog-track { height:14px; background:rgba(255,255,255,0.1); border-radius:14px; overflow:visible; position:relative; }
  .prog-fill { height:100%; border-radius:14px; background:linear-gradient(90deg,#46A302,#58CC02,#89E219); width:0%; transition:width 1.2s cubic-bezier(0.34,1.1,0.64,1) 0.6s; position:relative; }
  .prog-fill.go { width: 68%; }
  .prog-glow { position:absolute; right:-2px; top:50%; transform:translateY(-50%); width:20px; height:20px; border-radius:50%; background:#89E219; box-shadow:0 0 10px 4px rgba(137,226,25,0.6); }

  /* CTA */
  .cta { background:#58CC02; color:#fff; border:none; border-radius:16px; padding:16px 0; font-size:17px; font-weight:900; cursor:pointer; width:100%; max-width:300px; box-shadow:0 6px 0 #46A302; z-index:1; animation: slidein 0.4s ease-out 0.6s both; letter-spacing:0.01em; transition:transform 0.1s,box-shadow 0.1s; }
  .cta:hover { transform:translateY(-2px); box-shadow:0 8px 0 #46A302; }
  .cta:active { transform:translateY(3px); box-shadow:0 2px 0 #46A302; }

  /* Loader dots */
  .loader { display:flex; gap:8px; align-items:center; z-index:1; margin-bottom:8px; animation: slidein 0.4s ease-out 0.65s both; }
  .dot { width:8px; height:8px; border-radius:50%; background:rgba(255,255,255,0.3); animation:dotpulse 1.2s ease-in-out infinite; }
  .dot:nth-child(2){animation-delay:0.2s}
  .dot:nth-child(3){animation-delay:0.4s}
  @keyframes dotpulse{0%,100%{transform:scale(1);opacity:0.3}50%{transform:scale(1.4);opacity:1}}
  .loader-label { font-size:12px; color:rgba(255,255,255,0.3); font-weight:700; }
</style>

<div class="screen" id="screen">
  <div class="burst"></div>

  <!-- Confetti -->
  <div class="confetti-wrap" id="confetti"></div>

  <!-- Check -->
  <div class="check-wrap">
    <div class="check-ring">
      <span class="check-icon">✓</span>
    </div>
    <span class="star">⭐</span>
    <span class="star">✨</span>
    <span class="star">⭐</span>
    <span class="star">✨</span>
    <span class="star">⭐</span>
  </div>

  <div class="headline">Correct!</div>
  <div class="sub">You nailed it 🎯</div>

  <!-- XP gained -->
  <div class="xp-row">
    <div class="xp-pill">
      <span class="xp-icon">⚡</span>
      <div>
        <div class="xp-val">+10 XP</div>
        <div class="xp-label">earned</div>
      </div>
    </div>
    <div class="xp-pill">
      <span class="xp-icon">🔥</span>
      <div>
        <div class="xp-val">3 streak</div>
        <div class="xp-label">days</div>
      </div>
    </div>
  </div>

  <!-- Streak bonus -->
  <div class="streak-box">
    <span style="font-size:28px;">🏆</span>
    <div class="streak-text">
      <div class="streak-title">Streak bonus active!</div>
      <div class="streak-sub">Answer tomorrow to keep it going</div>
    </div>
  </div>

  <!-- Progress -->
  <div class="prog-wrap">
    <div class="prog-label"><span>Luke 1 progress</span><span>68%</span></div>
    <div class="prog-track">
      <div class="prog-fill go" id="progfill">
        <div class="prog-glow"></div>
      </div>
    </div>
  </div>

  <!-- Loading indicator -->
  <div class="loader">
    <div class="dot"></div><div class="dot"></div><div class="dot"></div>
    <span class="loader-label">Loading next question…</span>
  </div>

  <button class="cta" onclick="this.textContent='Loading…';this.disabled=true;">Continue →</button>
</div>

<script>
// Spawn confetti
const colors = ['#58CC02','#FFD060','#FF4B4B','#48C8FF','#FF9600','#fff'];
const shapes = ['▲','■','●','◆'];
const wrap = document.getElementById('confetti');
for(let i=0;i<48;i++){
  const el = document.createElement('div');
  el.className = 'confetti-piece';
  el.style.left = Math.random()*100+'%';
  el.style.top = '-20px';
  el.style.background = colors[Math.floor(Math.random()*colors.length)];
  el.style.borderRadius = Math.random()>0.5 ? '50%' : '2px';
  el.style.width = (8+Math.random()*8)+'px';
  el.style.height = (8+Math.random()*8)+'px';
  el.style.animationDuration = (1.5+Math.random()*2)+'s';
  el.style.animationDelay = (Math.random()*0.8)+'s';
  wrap.appendChild(el);
}
</script>
