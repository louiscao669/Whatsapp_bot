
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  .page { background: #F5F3EE; min-height: 600px; display: flex; align-items: center; justify-content: center; padding: 20px; }

  .trigger { background: #C87941; border: 4px solid #A05920; box-shadow: 0 6px 0 #7A3F10; border-radius: 20px; width: 100px; height: 84px; font-size: 44px; cursor: pointer; transition: transform 0.1s; display: flex; align-items: center; justify-content: center; animation: chestpulse 2s infinite; }
  .trigger:hover { transform: scale(1.06); }
  @keyframes chestpulse { 0%,100%{box-shadow:0 6px 0 #7A3F10,0 0 0 0 rgba(200,121,65,0.5)} 50%{box-shadow:0 6px 0 #7A3F10,0 0 0 16px rgba(200,121,65,0)} }

  .overlay { position:fixed; inset:0; background:rgba(0,0,0,0.72); display:flex; align-items:center; justify-content:center; z-index:100; opacity:0; pointer-events:none; transition:opacity 0.2s; }
  .overlay.show { opacity:1; pointer-events:all; }

  .modal { background:#1a1200; border:3px solid #FFD060; border-radius:28px; padding:32px 28px 24px; width:320px; text-align:center; box-shadow:0 0 60px rgba(255,184,0,0.4), 0 20px 40px rgba(0,0,0,0.6); transform:scale(0.8) translateY(20px); transition:transform 0.3s cubic-bezier(0.34,1.56,0.64,1); position:relative; overflow:hidden; }
  .overlay.show .modal { transform:scale(1) translateY(0); }
  .modal::before { content:''; position:absolute; inset:0; background:radial-gradient(ellipse at 50% 0%, rgba(255,200,0,0.15) 0%, transparent 70%); pointer-events:none; }

  .eyebrow { font-size:11px; font-weight:800; letter-spacing:0.12em; text-transform:uppercase; color:#A07000; margin-bottom:8px; }

  .chest-wrap { position:relative; display:inline-block; margin: 4px 0 8px; }
  .chest-emoji { font-size:80px; display:block; filter:drop-shadow(0 0 20px rgba(255,184,0,0.8)); animation:chestbounce 0.5s cubic-bezier(0.34,1.56,0.64,1) forwards; }
  @keyframes chestbounce { 0%{transform:scale(0.5) rotate(-10deg);opacity:0} 100%{transform:scale(1) rotate(0deg);opacity:1} }

  .coins { position:absolute; top:10px; left:50%; transform:translateX(-50%); width:1px; height:1px; }
  .coin { position:absolute; font-size:22px; opacity:0; }
  .overlay.show .coin { animation:coinfly 0.7s ease-out forwards; }
  .coin:nth-child(1) { animation-delay:0.15s; --tx:-55px; --ty:-65px; }
  .coin:nth-child(2) { animation-delay:0.2s;  --tx:-20px; --ty:-85px; }
  .coin:nth-child(3) { animation-delay:0.18s; --tx:20px;  --ty:-80px; }
  .coin:nth-child(4) { animation-delay:0.25s; --tx:55px;  --ty:-60px; }
  .coin:nth-child(5) { animation-delay:0.22s; --tx:0px;   --ty:-70px; }
  @keyframes coinfly {
    0%   { opacity:1; transform:translate(0,0) scale(0.5); }
    60%  { opacity:1; transform:translate(var(--tx),var(--ty)) scale(1.1); }
    100% { opacity:0; transform:translate(calc(var(--tx)*1.3),calc(var(--ty)*1.3 + 30px)) scale(0.8); }
  }

  .glow-ring { width:110px; height:110px; border-radius:50%; border:2px solid rgba(255,184,0,0.3); position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); animation:ringpulse 1.5s ease-out infinite; pointer-events:none; }
  @keyframes ringpulse { 0%{transform:translate(-50%,-50%) scale(0.8);opacity:0.8} 100%{transform:translate(-50%,-50%) scale(1.6);opacity:0} }

  .title { font-size:22px; font-weight:900; color:#FFE066; margin-bottom:20px; text-shadow:0 2px 10px rgba(255,200,0,0.5); }

  .reward-box { background:rgba(255,184,0,0.1); border:2px solid rgba(255,184,0,0.3); border-radius:16px; padding:16px; margin-bottom:20px; position:relative; }
  .reward-label { font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:0.08em; color:#A07000; margin-bottom:8px; }
  .coin-range { display:flex; align-items:center; justify-content:center; gap:6px; }
  .coin-icon { font-size:28px; filter:drop-shadow(0 2px 6px rgba(255,184,0,0.6)); }
  .range-text { font-size:32px; font-weight:900; color:#FFD060; text-shadow:0 2px 8px rgba(255,184,0,0.4); }

  .luck-wrap { margin-bottom:4px; }
  .luck-label { display:flex; justify-content:space-between; font-size:11px; font-weight:800; color:#806030; margin-bottom:6px; }
  .luck-track { height:10px; background:rgba(255,255,255,0.08); border-radius:10px; overflow:hidden; }
  .luck-fill { height:100%; border-radius:10px; background:linear-gradient(90deg,#FF9600,#FFD060,#FFE066); width:0%; transition:width 1s cubic-bezier(0.34,1.1,0.64,1) 0.4s; }
  .overlay.show .luck-fill { width:72%; }

  .cta { background:#FFD060; color:#1a0800; border:none; border-radius:14px; padding:14px 0; font-size:16px; font-weight:900; cursor:pointer; width:100%; box-shadow:0 5px 0 #CC8800; transition:transform 0.1s, box-shadow 0.1s; margin-top:16px; letter-spacing:0.01em; }
  .cta:hover { transform:translateY(-2px); box-shadow:0 7px 0 #CC8800; }
  .cta:active { transform:translateY(2px); box-shadow:0 2px 0 #CC8800; }

  .sparkle { position:absolute; font-size:14px; opacity:0; animation:sparkle 2s ease-in-out infinite; }
  .sparkle:nth-child(1) { top:12px; left:20px; animation-delay:0s; }
  .sparkle:nth-child(2) { top:20px; right:24px; animation-delay:0.6s; }
  .sparkle:nth-child(3) { bottom:60px; left:16px; animation-delay:1.1s; }
  .sparkle:nth-child(4) { bottom:80px; right:18px; animation-delay:0.3s; }
  @keyframes sparkle { 0%,100%{opacity:0;transform:scale(0.5) rotate(0deg)} 50%{opacity:1;transform:scale(1.2) rotate(20deg)} }
</style>

<div class="page">
  <div style="text-align:center;">
    <p style="font-size:13px;color:#888;margin-bottom:16px;font-weight:600;">Tap the chest to open</p>
    <button class="trigger" onclick="document.getElementById('overlay').classList.add('show')">🎁</button>
  </div>
</div>

<div class="overlay" id="overlay" onclick="if(event.target===this)this.classList.remove('show')">
  <div class="modal">
    <span class="sparkle">✨</span>
    <span class="sparkle">⭐</span>
    <span class="sparkle">✨</span>
    <span class="sparkle">⭐</span>

    <div class="eyebrow">Batch 1 complete</div>

    <div class="chest-wrap">
      <div class="glow-ring"></div>
      <span class="chest-emoji">🎁</span>
      <div class="coins">
        <span class="coin">🪙</span>
        <span class="coin">🪙</span>
        <span class="coin">🪙</span>
        <span class="coin">🪙</span>
        <span class="coin">🪙</span>
      </div>
    </div>

    <div class="title">Treasure chest!</div>

    <div class="reward-box">
      <div class="reward-label">Coin reward inside</div>
      <div class="coin-range">
        <span class="coin-icon">🪙</span>
        <span class="range-text">2 – 5</span>
        <span class="coin-icon">🪙</span>
      </div>
    </div>

    <div class="luck-wrap">
      <div class="luck-label"><span>🍀 Luck meter</span><span>72%</span></div>
      <div class="luck-track"><div class="luck-fill"></div></div>
    </div>

    <button class="cta" onclick="openChest()">Open chest 🎲</button>
  </div>
</div>

<script>
function openChest() {
  const coins = Math.floor(Math.random() * 4) + 2;
  const modal = document.querySelector('.modal');
  modal.innerHTML = `
    <span class="sparkle">✨</span><span class="sparkle">⭐</span>
    <span class="sparkle">✨</span><span class="sparkle">⭐</span>
    <div class="eyebrow">You got lucky!</div>
    <div style="font-size:90px;margin:8px 0;filter:drop-shadow(0 0 24px rgba(255,184,0,0.9));animation:chestbounce 0.5s cubic-bezier(0.34,1.56,0.64,1) forwards;">🎉</div>
    <div class="title" style="font-size:28px;">+${coins} coins!</div>
    <div style="display:flex;align-items:center;justify-content:center;gap:6px;margin:16px 0 8px;">
      ${Array(coins).fill('<span style="font-size:36px;display:inline-block;">🪙</span>').join('')}
    </div>
    <button class="cta" onclick="document.getElementById('overlay').classList.remove('show')" style="margin-top:12px;">Awesome! 🚀</button>
  `;
}
</script>
